[package]
name = "antigravity-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Universal OpenAI-to-Antigravity Chat and FIM completions bridge with model fallback"
authors = ["RikaKit2"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "process"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
